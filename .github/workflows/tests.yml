name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          for file in bin/install.sh bin/setup-skill-python.sh src/.bash_profile src/.bashrc src/bin/wsl-browser; do
            bash -n "$file" || exit
          done
      - name: Python tests with stubbed installers
        run: python3 -B -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 tests with stubbed installers
        shell: powershell
        run: .\tests\test_windows.ps1
      - name: PowerShell 7 tests with stubbed installers
        shell: pwsh
        run: .\tests\test_windows.ps1
