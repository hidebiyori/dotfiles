name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          for file in bin/install.sh bin/setup-skill-python.sh src/.bash_profile src/.bashrc src/bin/wsl-browser; do
            bash -n "$file" || exit
          done
      - name: Python tests with stubbed installers
        run: python3 -B -m unittest discover -s tests -v
      - name: Markdown relative links
        run: python3 -B bin/check-markdown-links.py .

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 tests with stubbed installers
        shell: powershell
        run: .\tests\test_windows.ps1
      - name: PowerShell 7 tests with stubbed installers
        shell: pwsh
        run: .\tests\test_windows.ps1
