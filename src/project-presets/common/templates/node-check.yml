name: Node checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 24h
          install_args: --jobs 1
          monorepo: false
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies from the npm cache when possible
        run: npm install --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Check the committed lockfile
        run: git diff --exit-code -- package-lock.json
      - run: npm run check
      - run: npm run typecheck --if-present
      - run: npm run test:ci
      - run: npm run build
